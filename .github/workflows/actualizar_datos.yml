name: Actualizar Lotería Florida Automático

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar script de Python
        run: python actualizar_loterias.py

      - name: Guardar cambios y actualizar CSV en el repositorio
        run: |
          git config --global user.name "Bot Lotería"
          git config --global user.email "bot@users.noreply.github.com"
          git add florida_pick3_pick4_historico.csv
          git commit -m "Automático: Actualización de resultados de la Florida"
          git push
